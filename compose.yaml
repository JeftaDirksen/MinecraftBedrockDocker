services:
  minecraftbedrock:
    build: .
    container_name: minecraftbedrock
    ports:
      - "${PORT:-19132}:19132/udp"
    volumes:
      - server:/data/server
    environment:
      - SEED=${SEED:-abc}
      - NVG_URL=${NVG_URL}
      - NVG_SECRET=${NVG_SECRET}
    restart: unless-stopped
    tty: true
    stdin_open: true

volumes:
  server:
